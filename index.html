<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>
          body{
            font-family: 'Gill Sans';
            background-image: url("https://i.pinimg.com/1200x/84/33/be/8433beaa300d9f30df041c4deaefab79.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
       .container {
           padding: 30px;
            border-radius: 15px;
            margin: auto;
            width: 450px;
            box-shadow: 0 4px 10px rgb(233, 231, 231);
            background-color: rgb(65, 32, 32);
            color:  rgb(254, 254, 254);
       }

       .form-container {
           padding: 30px;
            border-radius: 15px;
            margin: auto;
            width: 450px;
            box-shadow: 0 4px 10px rgb(233, 231, 231);
            background-color:rgb(65, 32, 32);
            color:  rgb(254, 254, 254);
       }

       #header2{
        color: rgb(254, 254, 254);
        font-family: "Trebuchet MS", sans-serif;
       }

        #header{
        color: rgb(101, 58, 46);
        font-family: Impact, sans-serif;
       }

       #output2{
         font-family: "Trebuchet MS", sans-serif;
       }

       #copyright{
        color: white;
        background-color: rgb(65, 32, 32);
       }

       #logo{
        display: block;
        width: 120px;
        height: auto;
        margin: 20px auto;
       }

    </style>


    <title>Checker</title>
</head>


<body>
    <img src="zephyr.png" alt="Zephyr logo" id="logo">

    <h1 id="header" class="text-center">Dance Club Checker</h1>
    <h5 id="header2" class="text-center">Candidate Verification System</h1>
        <br>

    <div class="form-container">

        <form>

            <input type="text" id="first" class="form-control" placeholder="First Name">
            <br>

            <input type="text" id="last" class="form-control" placeholder="Last Name">
            <br>

            <div class="text-center">
            <button type="button" id="btncheck" py-click="checker_result" class="btn btn-light "> ENTER</button>
            </div>

        </form>


    </div>

    <br>
    <br>


    <div id="output2" class="text-center container">


        Your checker results will appear here.

    </div>

    <script type="py" src="main.py"></script>



 <div>

</body>
</html>
